name: Mise à jour données vent + déploiement Pages

# Ce workflow tourne UNIQUEMENT dans ce repo de test.
# Il n'a aucune interaction avec le site Heroku de production.

on:
  # Le "schedule:" interne de GitHub Actions s'est révélé peu fiable en usage
  # réel (déclenchements irréguliers, retards, sauts complets - documenté par
  # GitHub comme "best-effort", non garanti). Remplacé par un appel externe
  # (cron-job.org) qui déclenche ce workflow via l'API GitHub à heure fixe
  # garantie. Voir README.md pour la configuration.
  workflow_dispatch: {}       # déclenché par cron-job.org (et testable manuellement)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # true (et non false) : si un run reste bloqué (ex. déploiement Pages en
  # attente), le déclenchement suivant le tue plutôt que de rester en file
  # d'attente indéfiniment derrière lui — ce qui gelait tout le cron.
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Récupérer les données Météo-France
        run: node build.js
        env:
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
          TOKEN_URL: ${{ secrets.TOKEN_URL }}

      - name: Commit des JSON mis à jour (si changement)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "Mise à jour automatique des données vent"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push réussi."
              exit 0
            fi
            echo "Push rejeté (tentative $i/5) : un autre commit est arrivé entre-temps sur main. Rebase et nouvel essai..."
            git pull --rebase origin main
            sleep 3
          done
          echo "Echec du push après 5 tentatives."
          exit 1

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
